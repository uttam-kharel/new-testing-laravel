name: Deploy to Vercel

# Optional CD path (no credit card / free tier):
# add the `VERCEL_TOKEN` secret in GitHub Settings -> Secrets to activate it.
# Prefer Vercel's native Git integration instead (dashboard -> Add New -> Project ->
# Import Git repo) — it needs no secrets and gives free preview deployments per PR.
on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy production
        runs-on: ubuntu-latest
        env:
            # Non-sensitive project identifiers (same values as .vercel/project.json)
            VERCEL_ORG_ID: team_TKO4eklVKvpy5hlk9KtncXoD
            VERCEL_PROJECT_ID: prj_bTePFLFfMpBJ9778f4tWZnvufQZW
        steps:
            - uses: actions/checkout@v4

            # `secrets` is not allowed in `if:` expressions, so the token is
            # injected via env and the gate runs inside the shell: without the
            # VERCEL_TOKEN secret the step exits 0 without deploying.
            - name: Deploy to Vercel
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  if [ -z "$VERCEL_TOKEN" ]; then
                    echo "VERCEL_TOKEN secret not set — skipping deploy (add it in GitHub Settings -> Secrets to activate CD)"
                    exit 0
                  fi
                  npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
