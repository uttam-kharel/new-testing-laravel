name: Deploy to Vercel

# CI/CD for this Laravel app (Vercel container runtime — Dockerfile.vercel).
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      – Vercel API token (from https://vercel.com/account/tokens)
#   VERCEL_ORG_ID     – team_...  (from `vercel link` -> .vercel/project.json -> "orgId")
#   VERCEL_PROJECT_ID – prj_...   (from `vercel link` -> .vercel/project.json -> "projectId")
#
# Behavior:
#   - push to production     → production deploy (container image build on Vercel)
#   - pull request → production → preview deploy with a unique .vercel.app URL + PR comment
#   - workflow_dispatch      → manual production re-deploy
#
# `main` is the development branch; only the `production` branch deploys to
# the live site. Merge `main` -> `production` (or `git push origin main:production`)
# to ship. Prefer Vercel's native Git integration for zero-secret auto-deploys.
#
# Without the VERCEL_TOKEN secret every deploy step exits 0 and skips, so the
# workflow is safe to ship before the secrets exist.
on:
    push:
        branches: [production]
    pull_request:
        branches: [production]
    workflow_dispatch:

concurrency:
    group: vercel-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    issues: write

env:
    VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
    # ── Preview deploy (pull requests against production) ─────────────
    preview:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Deploy preview to Vercel
              id: deploy
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  if [ -z "$VERCEL_TOKEN" ]; then
                    echo "VERCEL_TOKEN secret not set — skipping preview deploy."
                    exit 0
                  fi
                  url="$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN" 2>&1 | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | tail -n 1)"
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  echo "Preview URL: $url"

            - name: Comment preview URL on PR
              if: ${{ steps.deploy.outputs.url != '' }}
              uses: actions/github-script@v7
              with:
                  script: |
                      const url = '${{ steps.deploy.outputs.url }}';
                      await github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: `🚀 **Preview deployment ready:** ${url}`,
                      });

    # ── Production deploy (push to production / manual) ───────────────
    deploy:
        if: github.event_name != 'pull_request'
        name: Deploy production
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # `secrets` is not allowed in `if:` expressions, so the token is
            # injected via env and the gate runs inside the shell: without the
            # VERCEL_TOKEN secret the step exits 0 without deploying.
            - name: Deploy to Vercel
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  if [ -z "$VERCEL_TOKEN" ]; then
                    echo "VERCEL_TOKEN secret not set — skipping deploy (add it in GitHub Settings -> Secrets to activate CD)"
                    exit 0
                  fi
                  npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
