name: Deploy to Vercel

# Optional CD path (no credit card / free tier):
# add three GitHub secrets (Settings -> Secrets and variables -> Actions) to activate it:
#   VERCEL_TOKEN      – Vercel API token (from https://vercel.com/account/tokens)
#   VERCEL_ORG_ID     – team_...  (from `vercel link` -> .vercel/project.json -> "orgId")
#   VERCEL_PROJECT_ID – prj_...   (from `vercel link` -> .vercel/project.json -> "projectId")
#
# Behavior:
#   - push to production → production deploy (container image build on Vercel)
#   - workflow_dispatch  → manual production re-deploy
#
# `main` is the development branch; only the `production` branch deploys to
# the live site. Merge `main` -> `production` (or `git push origin main:production`)
# to ship. Prefer Vercel's native Git integration for free PR previews.
#
# Without the VERCEL_TOKEN secret the deploy step exits 0 and skips, so the
# workflow is safe to ship before the secrets exist.
on:
    push:
        branches: [production]
    workflow_dispatch:

concurrency:
    group: vercel-production
    cancel-in-progress: true

jobs:
    deploy:
        name: Deploy production
        runs-on: ubuntu-latest
        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        steps:
            - uses: actions/checkout@v4

            # `secrets` is not allowed in `if:` expressions, so the token is
            # injected via env and the gate runs inside the shell: without the
            # VERCEL_TOKEN secret the step exits 0 without deploying.
            - name: Deploy to Vercel
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  if [ -z "$VERCEL_TOKEN" ]; then
                    echo "VERCEL_TOKEN secret not set — skipping deploy (add it in GitHub Settings -> Secrets to activate CD)"
                    exit 0
                  fi
                  npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
